<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    TikTok's visual language — near-black ground, cyan/magenta chromatic offset —
    applied to a generic bin glyph. Deliberately no note logo or wordmark: using
    another product's marks in an extension icon is a common Web Store rejection.
    Kept inside a ~14px margin so the colour fringes never touch the tile edge.
  -->
  <defs>
    <g id="bin">
      <rect x="53" y="21" width="22" height="10" rx="5"/>
      <rect x="31" y="34" width="66" height="12" rx="6"/>
      <path d="M39 52h50l-4.9 47A12 12 0 0 1 72.2 110H55.8A12 12 0 0 1 43.9 99z"/>
    </g>
  </defs>

  <rect width="128" height="128" rx="28" fill="#161823"/>

  <!-- offset colour fringes, then the solid glyph on top -->
  <use href="#bin" fill="#25F4EE" transform="translate(-4 -2.5)"/>
  <use href="#bin" fill="#FE2C55" transform="translate(4 2.5)"/>
  <use href="#bin" fill="#FFFFFF"/>

  <!-- two slots, punched in the ground colour; wide gap so they survive 16px -->
  <g fill="#161823">
    <rect x="55" y="64" width="7" height="32" rx="3.5"/>
    <rect x="66" y="64" width="7" height="32" rx="3.5"/>
  </g>
</svg>
